[project]
name = "automation-load-test"
version = "0.1.0"
description = "Synthetic Dagster project for load-testing the Automations tab at scale: many small pipelines, each asset carrying an AutomationCondition."
requires-python = ">=3.9"
dependencies = [
    "dagster",
]

[project.optional-dependencies]
dev = [
    "dagster-webserver",
]

[tool.dagster]
module_name = "automation_load_test.definitions"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
